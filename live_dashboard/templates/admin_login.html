<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#070b12"/>
<title>Supreme Admin — Login</title>
<style>
:root{--bg:#070b12;--card:#0e1624;--line:#1a2738;--line2:#243248;--text:#e8f0ff;--muted:#8b9bb4;--green:#31e6a1;--blue:#4aa0ff;--gold:#e8c36a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(1200px 600px at 50% -10%,#122038 0%,var(--bg) 55%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:400px;background:linear-gradient(180deg,#121c2c,#0c1420);border:1px solid var(--line2);border-radius:22px;padding:28px 24px 22px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#3ef0b0,#1a9f6e);color:#06120e}
h1{margin:0;font-size:20px;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-weight:600;margin-top:2px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px}
input{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line2);background:#0a1018;color:var(--text);padding:0 14px;font-size:16px;outline:none}
input:focus{border-color:#3a6a9a;box-shadow:0 0 0 3px rgba(74,160,255,.15)}
button{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:16px;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,#3ef0b0,#1a9f6e);color:#06120e;box-shadow:0 10px 28px rgba(49,230,161,.28)}
button:active{opacity:.9}
.err{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:#2a1418;border:1px solid #5a3030;color:#ffb0b0;font-size:13px;font-weight:700}
.hint{margin-top:16px;font-size:11px;color:var(--muted);line-height:1.45;text-align:center}
.hint code{color:#9fd6ff}
</style>
</head>
<body>
<div class="wrap">
  <form class="card" method="post" action="/admin/login" autocomplete="username">
    <div class="brand">
      <div class="logo">SP</div>
      <div>
        <h1>Supreme Admin</h1>
        <small>consolă personală</small>
      </div>
    </div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label for="user">Utilizator</label>
    <input id="user" name="username" type="text" inputmode="text" autocapitalize="none" autocomplete="username" required autofocus/>
    <label for="pass">Parolă</label>
    <input id="pass" name="password" type="password" autocomplete="current-password" required/>
    <button type="submit">Intră în consolă</button>
    <p class="hint">Poți folosi și <code>/admin?a=TOKEN</code> dacă ai tokenul local.</p>
  </form>
</div>
</body>
</html>
